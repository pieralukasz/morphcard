<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>morphcard · deliveries demo</title>
<link rel="stylesheet" href="/examples/shared/demo.css">
<style>
  html, body { margin: 0; }
  body { background: #e5e9ef; }
  :root[data-theme="dark"] body { background: #05080c; }
  /* Frame layout: a fixed-size box in the top left corner, like a device. */
  .device { width: var(--w, 390px); height: var(--h, 800px); }
</style>
<script type="importmap">
  { "imports": { "morphcard": "/dist/index.js" } }
</script>
</head>
<body>
<div id="app"></div>
<script type="module">
  // Query parameters:
  //   layout=page|frame  the window scrolls, or a fixed-size box scrolls
  //   w, h               frame size in px (default 390 x 800)
  //   theme=dark         dark colours
  //   slow=4             play every transition four times slower
  //   reduce             force reduced motion
  //   wide=1|0           force the wide or narrow layout
  import { mountDemo } from "/examples/shared/demo.js";

  const params = new URLSearchParams(location.search);
  const layout = params.get("layout") ?? "page";
  if (params.get("theme") === "dark") document.documentElement.dataset.theme = "dark";
  const app = document.getElementById("app");
  if (layout === "frame") {
    app.classList.add("device");
    if (params.get("w")) app.style.setProperty("--w", `${params.get("w")}px`);
    if (params.get("h")) app.style.setProperty("--h", `${params.get("h")}px`);
  }
  const options = { layout, timeScale: Number(params.get("slow") ?? 1) };
  if (params.has("reduce")) options.reducedMotion = true;
  if (params.has("wide")) options.wide = params.get("wide") === "1";

  window.errors = [];
  window.addEventListener("error", (e) => window.errors.push(String(e.message)));
  window.demo = mountDemo(app, options);
  window.morph = window.demo.morph;
  document.documentElement.dataset.ready = "1";
</script>
</body>
</html>
